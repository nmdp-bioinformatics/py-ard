# This workflow will install Python dependencies, run tests and lint using uv
# For more information see: https://docs.astral.sh/uv/guides/integration/github/

name: Run BDD and Unit Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        python-version: "3.11"
    - name: Install dependencies
      run: |
        # Sync the project with the test and dev dependency groups (dev provides flake8)
        uv sync --group test --group dev
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        uv run flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        uv run flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Run BDD Tests
      run: |
        # When run the first time, it'll build the library
        uv run behave
        # When run the second time, it should use the already installed library
        uv run behave
    - name: Run Unit Tests
      run: |
        # When run the first time, it'll build the library
        uv run pytest
        # When run the second time, it should use the already installed library
        uv run pytest
